name: Generic File Update Check

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  UPSTREAM_REPO: 'IRNova/Nova-Proxy'
  UPSTREAM_BRANCH: 'main'
  # List your target paths here (one path per line).
  # Spaces inside file/folder names are supported.
  TARGET_PATHS: |
    worker.js
    version.json

jobs:
  check-updates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream and checkout target paths
        id: process_paths
        shell: bash
        run: |
          set -e

          # Read TARGET_PATHS line-by-line into an array safely
          TARGET_ARRAY=()
          while IFS= read -r line || [ -n "$line" ]; do
            # Trim leading/trailing whitespace
            trimmed="$(echo "$line" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            if [ -n "$trimmed" ]; then
              TARGET_ARRAY+=("$trimmed")
            fi
          done <<< "$TARGET_PATHS"

          if [ ${#TARGET_ARRAY[@]} -eq 0 ]; then
            echo "Error: TARGET_PATHS is empty."
            exit 1
          fi

          echo "Fetching upstream repository..."
          git fetch "https://github.com/${UPSTREAM_REPO}.git" "$UPSTREAM_BRANCH"

          echo "Validating path existence in upstream..."
          for path in "${TARGET_ARRAY[@]}"; do
            if ! git cat-file -e "FETCH_HEAD:$path" 2>/dev/null; then
              echo "Error: Path '$path' does not exist in upstream branch '$UPSTREAM_BRANCH'."
              exit 1
            fi
          done

          echo "Checking out specified paths from upstream..."
          git checkout FETCH_HEAD -- "${TARGET_ARRAY[@]}"

          # Check if working tree has staged or unstaged changes
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes detected in target paths."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changes detected in target paths."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: steps.process_paths.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore: update target files from upstream'
          title: 'Automated Update: Target Files from Upstream'
          body: |
            Automated update detected changes in the configured target paths from upstream (`${{ env.UPSTREAM_REPO }}:${{ env.UPSTREAM_BRANCH }}`).
          branch: 'auto-update-target-files'
          delete-branch: true
          labels: |
            dependencies
            automated pr
