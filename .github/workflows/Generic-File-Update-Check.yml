name: Generic File Update Check

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  UPSTREAM_REPO: 'IRNova/Nova-Proxy'
  UPSTREAM_BRANCH: 'main'
  # List your target paths here (one path per line).
  # Spaces inside file/folder names are supported.
  TARGET_PATHS: |
    worker.js
    version.json

jobs:
  check-updates:
    runs-on: ubuntu-latest
    steps:
      - name: Sync target paths and manage pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -e

          echo "Configuring git identity..."
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "Cloning current repository..."
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" .

          # Read TARGET_PATHS line-by-line into an array safely
          TARGET_ARRAY=()
          while IFS= read -r line || [ -n "$line" ]; do
            # Trim leading/trailing whitespace
            trimmed="$(echo "$line" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            if [ -n "$trimmed" ]; then
              TARGET_ARRAY+=("$trimmed")
            fi
          done <<< "$TARGET_PATHS"

          if [ ${#TARGET_ARRAY[@]} -eq 0 ]; then
            echo "Error: TARGET_PATHS is empty."
            exit 1
          fi

          echo "Fetching upstream repository..."
          git fetch "https://github.com/${UPSTREAM_REPO}.git" "$UPSTREAM_BRANCH"

          echo "Validating path existence in upstream..."
          for path in "${TARGET_ARRAY[@]}"; do
            if ! git cat-file -e "FETCH_HEAD:$path" 2>/dev/null; then
              echo "Error: Path '$path' does not exist in upstream branch '$UPSTREAM_BRANCH'."
              exit 1
            fi
          done

          echo "Checking out specified paths from upstream..."
          git checkout FETCH_HEAD -- "${TARGET_ARRAY[@]}"

          # Check if working tree has staged or unstaged changes
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes detected in target paths."
            exit 0
          fi

          echo "Changes detected in target paths. Preparing Pull Request..."
          BRANCH_NAME="auto-update-target-files"

          # Create or update branch and push changes
          git checkout -B "$BRANCH_NAME"
          git add "${TARGET_ARRAY[@]}"
          git commit -m "chore: update target files from upstream"
          git push --force-with-lease origin "$BRANCH_NAME"

          # Check if an open PR already exists for this branch
          EXISTING_PR=$(gh pr list --head "$BRANCH_NAME" --state open --json number --jq '.[0].number')

          if [ -n "$EXISTING_PR" ]; then
            echo "Pull Request #$EXISTING_PR is already open and updated with new commits."
          else
            echo "Creating new Pull Request..."
            gh pr create \
              --base main \
              --head "$BRANCH_NAME" \
              --title "Automated Update: Target Files from Upstream" \
              --body "Automated update detected changes in the configured target paths from upstream (\`${UPSTREAM_REPO}:${UPSTREAM_BRANCH}\`)." \
              --label "dependencies" \
              --label "automated pr"
          fi
